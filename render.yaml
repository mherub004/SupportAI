# Demo only. The free web service can sleep; the queue resumes when the service wakes.
# Review the provider's current free database expiry, quotas, and plan availability.
services:
  - type: web
    name: supportflow-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supportflow-demo-db
          property: connectionString
      - key: OPERATOR_TOKEN
        generateValue: true
      - key: CONNECTOR_MODE
        value: demo
      - key: MAILBOX
        value: support@example.invalid
      - key: AUTO_SEND_ENABLED
        value: "false"
      - key: PRODUCTION_APPROVED
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
databases:
  - name: supportflow-demo-db
    plan: free
